<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Create a potluck, share one link, and watch the menu organize itself. Guests add and claim dishes without signing up; hosts see live coverage." />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211e1b" media="(prefers-color-scheme: dark)" />
    <title>Potluck — plan the table together</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('potluck-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
